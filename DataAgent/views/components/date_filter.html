<div id="date-filter-section">
    <h5 style="margin-bottom: 15px; font-weight: 600;">📅 Date Range Filter</h5>
    <label style="font-size: 12px; font-weight: 500; color: #4a5568;">Start Date:</label>
    <input type="date" id="start-date" style="width: 100%; margin-bottom: 15px; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e0;">
    
    <label style="font-size: 12px; font-weight: 500; color: #4a5568;">End Date:</label>
    <input type="date" id="end-date" style="width: 100%; margin-bottom: 15px; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e0;">
    
    <button id="apply-date-filter" class="btn btn-primary btn-primary-custom" style="width: 100%; margin-top: 10px;">Apply Filter</button>
    <button id="clear-date-filter" class="btn btn-outline-secondary" style="width: 100%; margin-top: 10px;">Clear Filter</button>
</div>
